name: CI

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      GRADLE_OPTS: "-Dfile:encoding=UTF-8"

    steps:
      - name: Cache glslang
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/runelite
          key: ${{ runner.os }}-cache-${{ hashFiles('ci/build.sh') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build and Test
        run: ./ci/build.sh

  web:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Compile the WasmGC module
        run: ./gradlew -p runelite-browser-core buildWasmGC

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: runelite-browser-web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: runelite-browser-web
        run: npx playwright install --with-deps chromium

      - name: Lint, format, typecheck, build, unit test
        working-directory: runelite-browser-web
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
          npm run build
          npm run test

      # WebGL2 is the reliable headless backend; WebGPU is attempted only in
      # environments with a GPU adapter (run locally with `--project=webgpu`).
      - name: End-to-end render smoke (WebGL2)
        working-directory: runelite-browser-web
        run: npx playwright test --project=webgl2
