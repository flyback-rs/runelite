<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>RuneLite Browser — real client (CheerpJ)</title>
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
				background: #16161a;
				color: #d7d7db;
				font: 13px/1.5 ui-monospace, monospace;
			}
			#display {
				width: 100%;
				height: 70vh;
			}
			/* Fixed overlay so the boot phase stays visible above CheerpJ's
			   loading splash; pointer-events:none so it never blocks the client. */
			#log {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				max-height: 40vh;
				overflow: auto;
				white-space: pre-wrap;
				padding: 8px 12px;
				margin: 0;
				background: rgba(0, 0, 0, 0.82);
				color: #7cfc7c;
				z-index: 2147483647;
				pointer-events: none;
				font: 12px/1.45 ui-monospace, monospace;
			}
		</style>
	</head>
	<body>
		<!-- CheerpJ renders the client's AWT frame into this element. -->
		<div id="display"></div>
		<pre id="log"></pre>
		<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
		<script src="./socket-natives.js"></script>
		<script src="./boot.js"></script>
	</body>
</html>
