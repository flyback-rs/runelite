<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>RuneLite Browser Core</title>
	<style>
		body { font-family: system-ui, sans-serif; margin: 0; background: #1e1e22; color: #e6e6e6; }
		header { padding: 12px 16px; background: #2b2b31; border-bottom: 1px solid #3a3a42; }
		header h1 { margin: 0; font-size: 16px; font-weight: 600; }
		#panels { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
		.panel { min-width: 240px; background: #26262c; border: 1px solid #3a3a42; border-radius: 6px; }
		.panel-title { padding: 8px 12px; font-weight: 600; border-bottom: 1px solid #3a3a42; }
		.panel-body { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
		.c-section { margin-top: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #9a9aa4; }
		.c-label { font-size: 13px; }
		.c-button { align-self: flex-start; padding: 4px 10px; }
		.c-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
		#log { padding: 8px 16px; font-family: ui-monospace, monospace; font-size: 12px; color: #9a9aa4; }
	</style>
</head>
<body>
	<header><h1>RuneLite Browser Core &mdash; WasmGC bootstrap</h1></header>
	<div id="panels"></div>
	<div id="log">Loading WasmGC module&hellip;</div>

	<script>
		// The DOM hook the WasmGC module calls through BrowserPlatformUi. It turns a
		// declarative PanelModel (as JSON) into DOM, keeping panel layout on the JS
		// side and out of the Wasm module.
		window.runelitePublishPanel = function (pluginId, json)
		{
			const model = JSON.parse(json);
			const panels = document.getElementById("panels");
			let panel = document.getElementById("panel-" + pluginId);
			if (panel)
			{
				panel.remove();
			}
			panel = document.createElement("div");
			panel.className = "panel";
			panel.id = "panel-" + pluginId;

			const title = document.createElement("div");
			title.className = "panel-title";
			title.textContent = model.title;
			panel.appendChild(title);

			const bodyEl = document.createElement("div");
			bodyEl.className = "panel-body";
			for (const c of model.components)
			{
				bodyEl.appendChild(renderComponent(c));
			}
			panel.appendChild(bodyEl);
			panels.appendChild(panel);
			log("published panel '" + pluginId + "' with " + model.components.length + " components");
		};

		function renderComponent(c)
		{
			switch (c.type)
			{
				case "SECTION":
				{
					const el = document.createElement("div");
					el.className = "c-section";
					el.textContent = c.text;
					return el;
				}
				case "BUTTON":
				{
					const el = document.createElement("button");
					el.className = "c-button";
					el.textContent = c.text;
					return el;
				}
				case "TOGGLE":
				{
					const row = document.createElement("label");
					row.className = "c-row";
					const box = document.createElement("input");
					box.type = "checkbox";
					box.checked = c.value === "true";
					row.appendChild(box);
					row.appendChild(document.createTextNode(c.text));
					return row;
				}
				case "SLIDER":
				{
					const row = document.createElement("label");
					row.className = "c-row";
					const range = document.createElement("input");
					range.type = "range";
					range.value = c.value;
					row.appendChild(document.createTextNode(c.text));
					row.appendChild(range);
					return row;
				}
				case "TEXT_INPUT":
				{
					const row = document.createElement("label");
					row.className = "c-row";
					const input = document.createElement("input");
					input.type = "text";
					input.value = c.value || "";
					row.appendChild(document.createTextNode(c.text));
					row.appendChild(input);
					return row;
				}
				default:
				{
					const el = document.createElement("div");
					el.className = "c-label";
					el.textContent = c.text;
					return el;
				}
			}
		}

		function log(message)
		{
			document.getElementById("log").textContent = message;
		}

		// Load the TeaVM WasmGC runtime, then the module, then run its main().
		const runtime = document.createElement("script");
		runtime.src = "runelite-browser.wasm-runtime.js";
		runtime.onload = function ()
		{
			TeaVM.wasmGC.load("runelite-browser.wasm").then(function (teavm)
			{
				const main = teavm.exports.main || teavm.instance.exports.main;
				main([]);
			}).catch(function (e)
			{
				log("failed to load WasmGC module: " + e);
				console.error(e);
			});
		};
		document.body.appendChild(runtime);
	</script>
</body>
</html>
